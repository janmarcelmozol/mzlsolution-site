<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You | MZL Solution</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a0a0a;--cyan:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:linear-gradient(160deg,#0a0a0a,#161a17);color:#fff;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.box{max-width:520px}
.ok{width:72px;height:72px;border-radius:50%;background:rgba(34,197,94,.18);color:var(--cyan);display:grid;place-items:center;font-size:36px;font-weight:800;margin:0 auto 24px}
h1{font-size:32px;margin-bottom:12px}
p{color:#cbd5e1;font-size:17px;line-height:1.6;margin-bottom:28px}
a.btn{display:inline-block;background:var(--cyan);color:var(--navy);padding:14px 26px;border-radius:999px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <div class="ok">✓</div>
    <h1>Thank you!</h1>
    <p>Your request was sent to MZL Solution. We'll get back to you as soon as possible. For urgent dispatches, call <strong>(321) 352-2627</strong>.</p>
    <a class="btn" href="/">Back to website</a>
  </div>
</body>
</html>
